[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-switch"
version = "2.0.0"
description = "Antigravity Multi-Account Switcher & Vault Manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agy-switch = "agy_switcher.cli:main"

[tool.setuptools.package-dir]
"" = "scripts"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["agy_switcher*"]

[tool.mypy]
mypy_path = "scripts"
packages = ["agy_switcher"]
strict = true
